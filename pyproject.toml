[project]
name = "mytheus-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]>=2",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "redis[hiredis]>=5",
    "aiokafka>=0.11",
    "confluent-kafka[avro,schemaregistry]>=2.4",
    "fastavro>=1.9",
    "svix>=1.20",
    "temporalio>=1.7",
    "stripe>=10",
    "PyJWT>=2.8",
    "cryptography>=42",
    "livekit-api>=0.7",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "grpcio>=1.63",
    "grpcio-tools>=1.63",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25",
    "sentry-sdk[fastapi]>=2",
    "boto3>=1.43.64",
    "aiohttp>=3.14.1",
    # Direct dependency of services/identity_tenant_service/taxonomy/loader.py (Plan 5-6
    # section 3.2). Previously reachable only transitively via uvicorn[standard]'s --reload
    # config support, which is not a contract this module should rely on.
    "PyYAML>=6",
    "livekit>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres,redis,kafka]>=4",
    "ruff>=0.4",
    "black>=24",
    "mypy>=1.10",
    "types-redis>=4",
    "types-PyYAML>=6",
    "fakeredis>=2.20",
    # Dependency scanning (plan section 3.11 step 2). Runs in CI without `|| true`: a known
    # vulnerable dependency should fail the PR, which is the only reason to run a scanner.
    "pip-audit>=2.7",
    # Transitive, floored rather than suppressed. 82.0.1 carries PYSEC-2026-3447, fixed in
    # 83.0.0; the first pip-audit run flagged it. A floor here keeps the finding fixed
    # instead of allowlisted, which is the difference between a scanner and a formality.
    "setuptools>=83.0.0",
    "mcp>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services", "libs"]

[tool.ruff]
line-length = 100
extend-exclude = ["identity_pb2.py", "identity_pb2_grpc.py", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The generated gRPC stubs land at the repo root and are gitignored, so isort cannot infer
# they are ours and sorts them as third-party. The stub FILES are excluded from linting
# above, but every module that IMPORTS them was still failing I001. Declaring them
# first-party is what makes `make lint` green.
known-first-party = ["libs", "services", "identity_pb2", "identity_pb2_grpc"]

[tool.black]
line-length = 100
extend-exclude = "identity_pb2.py|identity_pb2_grpc.py|migrations/versions"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["identity_pb2.py", "identity_pb2_grpc.py", "migrations/", "tests/", "conftest.py"]

# Generated protobuf modules use descriptor magic mypy cannot see; treat them as untyped.
[[tool.mypy.overrides]]
module = ["identity_pb2", "identity_pb2_grpc"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (testcontainers)"]
