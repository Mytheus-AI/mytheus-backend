info:
  title: integration-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Healthz Healthz Get
                type: object
          description: Successful Response
        '500':
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security: []
      summary: Healthz
  /integrations:
    get:
      operationId: list_integrations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationList'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: List Integrations
      tags:
      - integrations
  /integrations/exports/decisions/{decision_id}:
    get:
      operationId: list_decision_exports
      parameters:
      - in: path
        name: decision_id
        required: true
        schema:
          format: uuid
          title: Decision Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionExportList'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: List Decision Exports
      tags:
      - integration-exports
    post:
      operationId: export_decision
      parameters:
      - in: path
        name: decision_id
        required: true
        schema:
          format: uuid
          title: Decision Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionExportRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionExport'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Export Decision
      tags:
      - integration-exports
  /integrations/exports/destinations:
    get:
      operationId: export_destinations
      parameters:
      - description: Where the record would go.
        in: query
        name: provider
        required: true
        schema:
          description: Where the record would go.
          enum:
          - notion
          - confluence
          - slack
          title: Provider
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportDestinations'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Export Destinations
      tags:
      - integration-exports
  /integrations/{provider}:
    delete:
      operationId: disconnect
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          title: Provider
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Disconnect
      tags:
      - integrations
  /integrations/{provider}/connect:
    post:
      operationId: connect
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          title: Provider
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeUrl'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Connect
      tags:
      - integrations
  /internal/crm/meeting-note:
    post:
      operationId: crm_meeting_note
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
