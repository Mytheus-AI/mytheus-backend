info:
  title: bff
  version: 1.0.0
openapi: 3.1.0
paths:
  /bff/dashboard:
    get:
      description: One composite payload for the user dashboard, org-scoped by RLS.
      operationId: dashboard
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 50
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Dashboard
      tags:
      - bff
  /bff/org/chart:
    get:
      description: One composite payload for the org-chart screen, org-scoped by RLS via `session`.
      operationId: org_chart
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgChart'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Org Chart
      tags:
      - bff
  /bff/people/{user_id}:
    get:
      description: 'A `user_id` in another tenant and a genuinely unknown one are indistinguishable here,

        both 404 - the same contract `GET /context/{user_id}` already gives, since this wraps that

        same resolver (existence is tenant-confidential, `libs/shared/authz.py::not_found`).'
      operationId: person_profile
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          format: uuid
          title: User Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonProfile'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Person Profile
      tags:
      - bff
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Healthz Healthz Get
                type: object
          description: Successful Response
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security: []
      summary: Healthz
security:
- HTTPBearer: []
