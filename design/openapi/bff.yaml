      required:
      - id
      - name
      - members
      title: TeamNode
      type: object
    TeamRef:
      description: 'A team membership as it appears inside `UserContext.team`. Not the full `Team`

        resource `core-api` serves at `GET /api/v1/teams` - just enough to identify and label it.'
      properties:
        department_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Department Id
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      - department_id
      title: TeamRef
      type: object
    TrendPoint:
      properties:
        coverage:
          anyOf:
          - type: number
          - type: 'null'
          title: Coverage
        decisions:
          title: Decisions
          type: integer
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        scheduled_start:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Scheduled Start
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      required:
      - meeting_id
      - title
      - scheduled_start
      - coverage
      - decisions
      title: TrendPoint
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    WorklogsArm:
      properties:
        items:
          items:
            $ref: '#/components/schemas/DashboardNote'
          title: Items
          type: array
        status:
          enum:
          - ok
          - degraded
          - empty
          title: Status
          type: string
      required:
      - status
      - items
      title: WorklogsArm
      type: object
  securitySchemes:
    HTTPBearer:
      bearerFormat: JWT
      description: Clerk-issued RS256 session token, verified against cached JWKS at `api-gateway` and
        re-verified in the service tier. `org_id` is derived from the token and is never accepted from
        a path, query, body or client header.
      scheme: bearer
      type: http
info:
  title: bff
  version: 1.0.0
openapi: 3.1.0
paths:
  /bff/dashboard:
    get:
      description: One composite payload for the user dashboard, org-scoped by RLS.
      operationId: dashboard
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 10
          maximum: 50
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Dashboard
      tags:
      - bff
  /bff/meetings/{meeting_id}/brief:
    get:
      description: 'Before a meeting: the caller''s agenda items, their open actions from the previous

        meeting with the latest status, their saved questions, and who sent their agent.'
      operationId: meeting_brief
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingBrief'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Meeting Brief
      tags:
      - bff
  /bff/meetings/{meeting_id}/catch-up:
    get:
      description: 'What the meeting did, for a participant who sent their agent (or missed it): the agenda

        with statuses and agent notes, the confirmed decisions, the actions assigned to the caller,

        the caller''s own surfaced notes and the questions they left their agent. Any participant

        may read it: attendance is not tracked beyond `attendance`, so "missed it" cannot be told

        apart from "was there".'
      operationId: meeting_catch_up
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingCatchUp'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Meeting Catch Up
      tags:
      - bff
  /bff/meetings/{meeting_id}/decisions/{decision_id}/lineage:
    get:
      operationId: decision_lineage
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      - in: path
        name: decision_id
        required: true
        schema:
          format: uuid
          title: Decision Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionLineage'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Decision Lineage
      tags:
      - bff
  /bff/meetings/{meeting_id}/health:
    get:
      description: 'After a meeting (409 before it ended): length, people-hours, agenda coverage, what
        was

        confirmed, who talked, whether it could have been async, and the trend over the meetings it

        follows up (up to 6 back through `previous_meeting_id`, oldest first, then this one).


        `duration_minutes` is the scheduled length (no actual start and end are stored); without a

        schedule it falls back to the transcript''s span, else null. `people_hours` counts the

        participants who attended live.'
      operationId: meeting_health
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingHealth'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Meeting Health
      tags:
      - bff
  /bff/org/chart:
    get:
      description: One composite payload for the org-chart screen, org-scoped by RLS via `session`.
      operationId: org_chart
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgChart'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Org Chart
      tags:
      - bff
  /bff/people/{user_id}:
    get:
      description: 'A `user_id` in another tenant and a genuinely unknown one are indistinguishable here,

        both 404 - the same contract `GET /context/{user_id}` already gives, since this wraps that

        same resolver (existence is tenant-confidential, `libs/shared/authz.py::not_found`).'
      operationId: person_profile
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          format: uuid
          title: User Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonProfile'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Person Profile
      tags:
      - bff
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Healthz Healthz Get
                type: object
          description: Successful Response
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security: []
      summary: Healthz
security:
- HTTPBearer: []
