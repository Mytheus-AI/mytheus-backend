info:
  title: billing-metering-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /billing/checkout:
    post:
      description: 'authz: admin. Price the purchase server-side and open a Razorpay order for it.'
      operationId: create_checkout
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrder'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Create Checkout
      tags:
      - billing-checkout
  /billing/checkout/verify:
    post:
      description: 'authz: admin. Check Razorpay''s signature for one of this tenant''s orders, then apply
        it.


        Its own transaction rather than `tenant_session`, so the Redis mirror and the staff email

        happen strictly after the purchase has committed.'
      operationId: verify_checkout
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Verify Checkout
      tags:
      - billing-checkout
  /billing/internal/budget:
    post:
      operationId: refresh_budget
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetMirror'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: Missing or invalid credentials for this operation's own security scheme (not a
            bearer token).
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security:
      - MytheusServiceToken: []
      summary: Refresh Budget
      tags:
      - billing-internal
  /billing/status:
    get:
      description: 'authz: member. Whether AI is paused for this workspace, and its plan; usage for admins.'
      operationId: billing_status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStatus'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Billing Status
      tags:
      - billing-checkout
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Healthz Healthz Get
                type: object
          description: Successful Response
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security: []
      summary: Healthz
  /internal/plan-features:
    get:
      operationId: plan_features
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanFeatures'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: Missing or invalid credentials for this operation's own security scheme (not a
            bearer token).
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security:
      - MytheusServiceToken: []
      summary: Plan Features
      tags:
      - billing-internal
  /plans:
    get:
      description: The latest version of each plan. Global catalog; no tenant data.
      operationId: list_plans
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlanOut'
                title: Response List Plans
                type: array
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: List Plans
      tags:
      - billing
  /usage:
    get:
      operationId: get_usage
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageOut'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Get Usage
      tags:
      - billing
security:
- HTTPBearer: []
