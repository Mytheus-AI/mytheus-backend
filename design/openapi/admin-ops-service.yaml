      operationId: update_flag
      parameters:
      - in: path
        name: flag_id
        required: true
        schema:
          format: uuid
          title: Flag Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Update Flag
      tags:
      - admin-ops
  /admin/ops/health:
    get:
      description: 'authz: staff. Service probes and the outbox backlog (counts per workspace only).'
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Successful Response
        '401':
