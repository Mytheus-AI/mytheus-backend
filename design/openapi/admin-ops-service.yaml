info:
  title: admin-ops-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /admin/ops/audit/search:
    post:
      description: 'authz: staff with an active support grant from that tenant. Read-only page of one

        tenant''s `audit_logs`, newest first; the read is itself logged with that tenant as the

        target. A POST so the tenant id rides in the body.'
      operationId: search_audit
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditSearch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Search Audit
      tags:
      - admin-ops
  /admin/ops/costs:
    get:
      description: 'authz: staff. Per-tenant token usage this billing period, from aggregate tables only.

        Same tenant order and paging as the directory.'
      operationId: cost_report
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostReport'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Cost Report
      tags:
      - admin-ops
  /admin/ops/flags:
    get:
      description: 'authz: staff. Every flag, global first.'
      operationId: list_flags
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlagList'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: List Flags
      tags:
      - admin-ops
    post:
      description: 'authz: staff. 409 if the (key, org) pair exists; 404 for an unknown org.'
      operationId: create_flag
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Create Flag
      tags:
      - admin-ops
  /admin/ops/flags/{flag_id}:
    delete:
      description: 'authz: staff.'
      operationId: delete_flag
      parameters:
      - in: path
        name: flag_id
        required: true
        schema:
          format: uuid
          title: Flag Id
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Delete Flag
      tags:
      - admin-ops
    patch:
      description: 'authz: staff.'
      operationId: update_flag
      parameters:
      - in: path
        name: flag_id
        required: true
        schema:
          format: uuid
          title: Flag Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Update Flag
      tags:
      - admin-ops
  /admin/ops/tenants:
    get:
      description: 'authz: staff. Tenant directory, newest first, keyset-paged: aggregates only.'
      operationId: list_tenants
      parameters:
      - in: query
