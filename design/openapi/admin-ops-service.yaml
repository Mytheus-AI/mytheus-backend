        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackStatusUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsFeedback'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Set Feedback Status
      tags:
      - admin-ops
  /admin/ops/flags:
    get:
      description: 'authz: staff. Every flag, global first.'
