          default: all
          enum:
          - new
          - seen
          - resolved
          - all
          title: State
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsFeedbackList'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Feedback Inbox
      tags:
      - admin-ops
  /admin/ops/feedback/status:
    post:
      description: 'authz: staff. Mark a report new, seen or resolved.'
      operationId: set_feedback_status
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
