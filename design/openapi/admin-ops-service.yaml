  securitySchemes:
    HTTPBearer:
      bearerFormat: JWT
      description: 'Clerk-issued RS256 session token, verified against cached JWKS at `api-gateway` and
        re-verified in the service tier. `org_id` is derived from the token and is never accepted from
        a path, query, body or client header. The public API (meetings, decisions, actions, commitments,
        search, ask, MCP) also accepts a personal access token, `mytheus_pat_...`, created under `/api/v1/api-tokens`:
        it acts as its owner, `read` tokens may only read, and each token is rate limited at the gateway.'
      scheme: bearer
      type: http
info:
  title: admin-ops-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /admin/ops/audit/search:
    post:
      description: 'authz: staff with an active support grant from that tenant. Read-only page of one

        tenant''s `audit_logs`, newest first; the read is itself logged with that tenant as the

        target. A POST so the tenant id rides in the body.'
      operationId: search_audit
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditSearch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Search Audit
      tags:
      - admin-ops
  /admin/ops/costs:
    get:
      description: 'authz: staff. Per-tenant token usage this billing period, from aggregate tables only.

        Same tenant order and paging as the directory.'
      operationId: cost_report
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostReport'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Cost Report
      tags:
      - admin-ops
  /admin/ops/feedback:
    get:
      description: 'authz: staff. Every report, newest first (at most 200), with counts by state.'
      operationId: feedback_inbox
      parameters:
      - in: query
