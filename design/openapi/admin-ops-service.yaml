        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: List Tenants
      tags:
      - admin-ops
  /admin/ops/tenants/reinstate:
    post:
      description: 'authz: staff. Reinstate through identity (no `admin-events` symbol exists for it).'
      operationId: reinstate_tenant
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
