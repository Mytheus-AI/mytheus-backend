          - type: string
          - type: 'null'
          title: Agent Instructions
        agent_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Name
        agent_personality:
          anyOf:
          - enum:
            - balanced
            - concise
            - detailed
            - direct
            - friendly
            type: string
          - type: 'null'
          title: Agent Personality
        bio:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Bio
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        ignore_topics:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Ignore Topics
        listen_for:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Listen For
        role:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Role
        skills:
          anyOf:
          - items:
              maxLength: 100
              minLength: 1
              type: string
            type: array
          - type: 'null'
          title: Skills
        subdivision:
          anyOf:
          - type: string
          - type: 'null'
          title: Subdivision
      title: UserProfileUpdate
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
