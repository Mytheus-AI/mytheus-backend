      - glossary
      - team
      title: Welcome
      type: object
    WelcomeOwner:
      properties:
        owner_user_id:
          format: uuid
          title: Owner User Id
          type: string
        topic:
          title: Topic
          type: string
      required:
      - topic
      - owner_user_id
      title: WelcomeOwner
      type: object
  securitySchemes:
    HTTPBearer:
      bearerFormat: JWT
      description: 'Clerk-issued RS256 session token, verified against cached JWKS at `api-gateway` and
        re-verified in the service tier. `org_id` is derived from the token and is never accepted from
        a path, query, body or client header. The public API (meetings, decisions, actions, commitments,
        search, ask, MCP) also accepts a personal access token, `mytheus_pat_...`, created under `/api/v1/api-tokens`:
        it acts as its owner, `read` tokens may only read, and each token is rate limited at the gateway.'
      scheme: bearer
      type: http
    MytheusServiceToken:
      description: INTERNAL ONLY. Per-caller shared secret from MYTHEUS_IDENTITY_CALLER_TOKENS, sent with
        `X-Mytheus-Service` (caller name) and `X-Mytheus-Org` (target tenant).
      in: header
      name: X-Mytheus-Service-Token
      type: apiKey
info:
  title: identity-tenant-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /.well-known/oauth-authorization-server:
