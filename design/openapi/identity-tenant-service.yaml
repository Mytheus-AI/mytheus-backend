  securitySchemes:
    HTTPBearer:
      bearerFormat: JWT
      description: Clerk-issued RS256 session token, verified against cached JWKS at `api-gateway` and
        re-verified in the service tier. `org_id` is derived from the token and is never accepted from
        a path, query, body or client header.
      scheme: bearer
      type: http
    MytheusServiceToken:
      description: INTERNAL ONLY. Per-caller shared secret from MYTHEUS_PII_VAULT_CALLER_TOKENS, sent
        with `X-Mytheus-Service` (caller name) and `X-Mytheus-Org` (tenant). Never routed by api-gateway.
      in: header
      name: X-Mytheus-Service-Token
      type: apiKey
info:
  title: identity-tenant-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /clerk/webhook:
    post:
      operationId: clerk_webhook
      parameters:
      - in: header
        name: svix-id
        required: true
        schema:
          title: Svix-Id
          type: string
      - in: header
        name: svix-timestamp
        required: true
        schema:
          title: Svix-Timestamp
          type: string
      - in: header
        name: svix-signature
        required: true
        schema:
          title: Svix-Signature
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Clerk Webhook
                type: object
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security: []
      summary: Clerk Webhook
      tags:
      - auth
  /context/{user_id}:
    get:
      operationId: read_user_context
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          format: uuid
          title: User Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Read User Context
      tags:
      - context
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Healthz Healthz Get
                type: object
          description: Successful Response
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security: []
      summary: Healthz
  /orgs:
    get:
      description: 'The organization the caller''s token is scoped to, and only that one.


        A collection path returning one object, deliberately: `/orgs/{id}` would put a tenant

        identifier in the path (`org-id-never-in-path` in `design/.spectral.yaml`), and a list

        would only ever have one visible member anyway.'
      operationId: read_own_org
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Read Own Org
      tags:
      - orgs
    post:
      description: 'Create a complete tenant: root, settings, residency, owner + grant, outbox, audit.


        `Idempotency-Key` is honoured by the shared middleware (scoped to the OPERATOR''s tenant),

        so a retried request replays the stored 201. Without a key, a repeat is a 409.'
      operationId: provision_org
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedOrganization'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Provision Org
      tags:
      - orgs
  /orgs/self-serve:
    post:
      description: 'authz: Clerk `org:admin` of the token''s active organization (checked against Clerk).


        Creates the tenant for the caller''s active Clerk organization: root, settings, residency,

        the caller as `owner`, outbox and audit, then publishes `internal_org_id` to Clerk.'
      operationId: self_serve_provision
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: Already provisioned
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Self Serve Provision
      tags:
      - orgs
  /pii-tokens/mint:
    post:
      operationId: mint_tokens
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintResponse'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: Missing or invalid credentials for this operation's own security scheme (not a
            bearer token).
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security:
      - MytheusServiceToken: []
      summary: Mint Tokens
      tags:
      - pii-vault
  /pii-tokens/resolve:
