info:
  title: identity-tenant-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /clerk/webhook:
    post:
      operationId: clerk_webhook
      parameters:
      - in: header
        name: svix-id
        required: true
        schema:
          title: Svix-Id
          type: string
      - in: header
        name: svix-timestamp
        required: true
        schema:
          title: Svix-Timestamp
          type: string
      - in: header
        name: svix-signature
        required: true
        schema:
          title: Svix-Signature
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Clerk Webhook
                type: object
          description: Successful Response
        '422':
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security: []
      summary: Clerk Webhook
      tags:
      - auth
  /context/{user_id}:
    get:
      operationId: read_user_context
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          format: uuid
          title: User Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Read User Context
      tags:
      - context
  /healthz:
