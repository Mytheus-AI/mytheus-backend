      - decisions_confirmed
      - actions_proposed
      - actions_confirmed
      - collaborations
      - context_fills
      title: PostMeetingDigest
      type: object
    Problem:
      description: 'RFC 7807 problem detail. Every 4xx and 5xx this service emits has this shape, including
        the ones FastAPI would otherwise return in its own format: `libs/shared/errors.py` registers handlers
        for `ProblemDetail`, `HTTPException`, `RequestValidationError` and bare `Exception`.'
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/ErrorCode'
        detail:
          description: Human-readable specifics. Never parsed.
          type: string
        instance:
          description: URI of the failing request.
          type: string
        status:
          description: Repeats the HTTP status code.
          type: integer
        title:
          description: Short human-readable summary.
          type: string
        trace_id:
          description: Correlates with the trace and logs.
          type: string
        type:
          description: Stable error type URI.
          format: uri
          type: string
      required:
      - type
      - title
      - status
      - code
      type: object
    RecordsRequest:
      additionalProperties: false
      properties:
        action_ids:
          items:
            format: uuid
            type: string
          maxItems: 100
          title: Action Ids
          type: array
        decision_ids:
          items:
            format: uuid
            type: string
          maxItems: 100
          title: Decision Ids
          type: array
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - user_id
      title: RecordsRequest
      type: object
    RelatedAttendees:
      properties:
        user_ids:
          items:
            format: uuid
            type: string
          title: User Ids
          type: array
      required:
      - user_ids
      title: RelatedAttendees
      type: object
    RetrievalScope:
      properties:
        meetings:
          items:
            $ref: '#/components/schemas/ScopeMeeting'
          title: Meetings
          type: array
        people:
          items:
            $ref: '#/components/schemas/ScopePerson'
          title: People
          type: array
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - user_id
      - meetings
      - people
      title: RetrievalScope
      type: object
    RetrievedAction:
      properties:
        assignee_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Assignee Id
        content:
          title: Content
          type: string
        due_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Due Date
        id:
          format: uuid
          title: Id
          type: string
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        status:
          title: Status
          type: string
      required:
      - id
      - meeting_id
      - content
      - assignee_id
      - due_date
      - status
      title: RetrievedAction
      type: object
    RetrievedDecision:
      properties:
        content:
          title: Content
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        rationale:
          anyOf:
          - type: string
          - type: 'null'
          title: Rationale
        status:
          title: Status
          type: string
      required:
      - id
      - meeting_id
      - content
      - rationale
      - status
      - created_at
      title: RetrievedDecision
      type: object
    RetrievedRecords:
      properties:
        actions:
          items:
            $ref: '#/components/schemas/RetrievedAction'
          title: Actions
