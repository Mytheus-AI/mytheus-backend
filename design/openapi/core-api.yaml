      title: RetrievedRecords
      type: object
    RoomState:
      additionalProperties: false
      properties:
        state:
          enum:
          - live
          - ended
          title: State
          type: string
      required:
      - state
      title: RoomState
      type: object
    RoomStateResult:
      properties:
        changed:
          title: Changed
          type: boolean
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        status:
          title: Status
          type: string
      required:
      - meeting_id
      - status
      - changed
      title: RoomStateResult
      type: object
    ScopeMeeting:
      properties:
        id:
          format: uuid
          title: Id
          type: string
        started_at:
          format: date-time
          title: Started At
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      required:
      - id
      - title
      - started_at
      title: ScopeMeeting
      type: object
    ScopePerson:
      properties:
        email:
          title: Email
          type: string
        id:
          format: uuid
          title: Id
          type: string
      required:
