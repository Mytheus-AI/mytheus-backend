  /api/v1/meetings/{meeting_id}/transcript:
    get:
      description: 'Finals only, in spoken order. No `org_id` parameter: RLS scopes it to the caller.


        `from_ms` is the plan''s "timestamp jump via `(meeting_id, start_ms)`" (section 3.8 step 2):

        seek straight to the first final at or after a millisecond offset. It is a server-side seek

        rather than something the client does after loading everything, because "load the whole

        meeting and scroll" only holds while a meeting fits in one page. The capacity model says

        ~360 finals and `MAX_LIMIT` is 500, so today it usually would - but a long meeting is

        exactly the case where jumping matters most, and that is the case where the client-side

        shortcut fails. Both forms use the same `(meeting_id, start_ms)` index.


        `cursor` wins if both are given: a cursor is a position in a walk already in progress, and

        silently restarting that walk somewhere else would repeat or skip rows.'
      operationId: get_transcript
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: query
        name: from_ms
        required: false
        schema:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          title: From Ms
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptPage'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Get Transcript
      tags:
      - transcript
