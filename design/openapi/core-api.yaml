        a path, query, body or client header. The public API (meetings, decisions, actions, commitments,
        search, ask, MCP) also accepts a personal access token, `mytheus_pat_...`, created under `/api/v1/api-tokens`:
        it acts as its owner, `read` tokens may only read, and each token is rate limited at the gateway.'
      scheme: bearer
      type: http
    MytheusServiceToken:
      description: INTERNAL ONLY. Per-caller shared secret from MYTHEUS_CORE_CALLER_TOKENS, sent with
        `X-Mytheus-Service` (caller name) and `X-Mytheus-Org` (tenant).
      in: header
      name: X-Mytheus-Service-Token
      type: apiKey
