      type: object
    SlackDigest:
      properties:
        actions:
          items:
            $ref: '#/components/schemas/DigestAction'
          title: Actions
          type: array
        decisions:
          items:
            $ref: '#/components/schemas/DigestDecision'
          title: Decisions
          type: array
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        participants:
          items:
            $ref: '#/components/schemas/DigestParticipant'
          title: Participants
          type: array
        scheduled_start:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Scheduled Start
        status:
          title: Status
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      required:
      - meeting_id
      - title
      - status
      - scheduled_start
      - participants
      - decisions
      - actions
      title: SlackDigest
      type: object
    SpeakerAssign:
      additionalProperties: false
      properties:
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - user_id
      title: SpeakerAssign
      type: object
    Suggestion:
      description: One `agent_suggestions` row, as its owner sees it. Never served to anyone else.
      properties:
        citations:
          items:
            $ref: '#/components/schemas/SuggestionCitation'
          title: Citations
          type: array
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        priority:
          maximum: 3.0
          minimum: 1.0
          title: Priority
          type: integer
        question:
          title: Question
          type: string
        rationale:
          anyOf:
          - type: string
          - type: 'null'
          title: Rationale
        status:
          enum:
          - open
          - asked
          - dismissed
          - saved
          title: Status
          type: string
      required:
      - id
      - meeting_id
      - question
      - priority
      - status
      - created_at
      title: Suggestion
      type: object
    SuggestionCitation:
      description: 'One grounding source of a suggestion, in the four ADR-0033 D3 kinds. A transcript

        citation opens the meeting at `start_ms`; a document one opens the document; a decision or

        action one opens the decision lineage page or the meeting.'
      properties:
        action_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Action Id
        chunk_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Chunk Id
        decision_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision Id
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        kind:
          enum:
          - transcript
          - document
          - decision
          - action
          title: Kind
          type: string
        meeting_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Meeting Id
        start_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start Ms
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      required:
      - kind
      title: SuggestionCitation
      type: object
    SuggestionList:
      description: '`GET /suggestions?meeting_id=`: the caller''s open, surfaced suggestions for that
        meeting

        (oldest first) and every suggestion they saved for later, from any meeting (newest first).'
      properties:
        open:
          items:
            $ref: '#/components/schemas/Suggestion'
          title: Open
          type: array
        saved:
          items:
            $ref: '#/components/schemas/Suggestion'
          title: Saved
          type: array
      required:
      - open
      - saved
      title: SuggestionList
      type: object
    Team:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        department_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Department Id
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      - department_id
      - created_at
      title: Team
      type: object
    TeamCreate:
      additionalProperties: false
      properties:
        department_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Department Id
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: TeamCreate
      type: object
    TeamMember:
      properties:
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        team_id:
          format: uuid
          title: Team Id
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - team_id
      - user_id
      - role
      title: TeamMember
      type: object
    TeamMemberUpsert:
      additionalProperties: false
      properties:
        role:
          anyOf:
          - maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          title: Role
      title: TeamMemberUpsert
      type: object
    TranscriptChunk:
      description: 'One persisted final from `transcript_chunks`, owned by `transcription-service`.


        `speaker_id` is the raw diarized label as Deepgram emitted it, never a resolved user: the

        `speaker_id` to `user_id` mapping lives in `meeting_speakers` and is served separately, so

        a client relabels turns by joining the two rather than this endpoint guessing. `redacted`

        tells a reader that the text it is seeing had PII replaced, which matters when a transcript

        reads oddly and the reason is redaction rather than mis-transcription.'
      properties:
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
        end_ms:
          title: End Ms
          type: integer
        id:
          format: uuid
          title: Id
          type: string
        is_final:
          title: Is Final
          type: boolean
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        redacted:
          default: false
          title: Redacted
          type: boolean
        speaker_id:
          title: Speaker Id
          type: string
        start_ms:
          title: Start Ms
          type: integer
        text:
          title: Text
          type: string
      required:
      - id
      - meeting_id
      - speaker_id
      - start_ms
      - end_ms
      - text
      - is_final
      title: TranscriptChunk
      type: object
    TranscriptPage:
      description: 'Cursor pagination over `(start_ms, id)`, the same tuple the ORDER BY and the table''s

        `(meeting_id, start_ms)` index use, so a page is an index range scan and a concurrent

        insert cannot shift rows out of a later page.'
      properties:
        items:
          items:
            $ref: '#/components/schemas/TranscriptChunk'
          title: Items
          type: array
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      required:
      - items
      title: TranscriptPage
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    Worklog:
      description: 'One `PersonalListenerAgent` note from `worklogs` (Plan 7-9 section 3.3).


        Only `surfaced` notes are ever served; the 0.4-0.7 silent-log band stays in the table and

        is not returned. `window_id` ties the note to the 30 s agent window it came from, and

        `source_chunk_ids` to the transcript finals in that window.'
      properties:
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
        content:
          title: Content
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        meeting_id:
          format: uuid
          title: Meeting Id
          type: string
        relevance_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Relevance Score
        source_chunk_ids:
          items:
            format: uuid
            type: string
          title: Source Chunk Ids
          type: array
        user_id:
          format: uuid
          title: User Id
          type: string
        window_id:
          title: Window Id
          type: string
      required:
      - id
      - meeting_id
      - user_id
      - window_id
      - content
      - source_chunk_ids
      - created_at
      title: Worklog
      type: object
    WorklogList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Worklog'
          title: Items
          type: array
      required:
      - items
      title: WorklogList
      type: object
  securitySchemes:
    HTTPBearer:
      bearerFormat: JWT
      description: Clerk-issued RS256 session token, verified against cached JWKS at `api-gateway` and
        re-verified in the service tier. `org_id` is derived from the token and is never accepted from
        a path, query, body or client header.
      scheme: bearer
      type: http
    MytheusServiceToken:
      description: INTERNAL ONLY. Per-caller shared secret from MYTHEUS_CORE_CALLER_TOKENS, sent with
        `X-Mytheus-Service` (caller name) and `X-Mytheus-Org` (tenant).
      in: header
      name: X-Mytheus-Service-Token
      type: apiKey
info:
  title: core-api
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/actions:
    get:
      operationId: list_my_tasks
      parameters:
      - in: query
        name: assignee_id
        required: true
        schema:
          const: me
          title: Assignee Id
          type: string
      - in: query
        name: status
        required: false
        schema:
          default: confirmed
          enum:
          - confirmed
          - done
          title: Status
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTaskList'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: List My Tasks
      tags:
      - actions
  /api/v1/actions/{action_id}:
    patch:
      operationId: update_action
      parameters:
      - in: path
        name: action_id
        required: true
        schema:
          format: uuid
          title: Action Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionItemUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItem'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Update Action
      tags:
      - actions
  /api/v1/actions/{action_id}/confirm:
    post:
      description: proposed -> confirmed, and the ONE `actions` outbox row. Idempotent on re-confirm.
      operationId: confirm_action
      parameters:
      - in: path
        name: action_id
        required: true
        schema:
          format: uuid
          title: Action Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItem'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Confirm Action
      tags:
      - actions
  /api/v1/actions/{action_id}/dismiss:
    post:
      description: proposed -> dismissed. Emits nothing. Idempotent on re-dismiss.
      operationId: dismiss_action
      parameters:
      - in: path
        name: action_id
        required: true
        schema:
          format: uuid
          title: Action Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItem'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Dismiss Action
      tags:
      - actions
  /api/v1/actions/{action_id}/done:
    post:
      operationId: mark_done
      parameters:
      - in: path
        name: action_id
        required: true
        schema:
          format: uuid
          title: Action Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTask'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Mark Done
      tags:
      - actions
  /api/v1/chat:
    post:
      operationId: post_chat
      parameters:
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Post Chat
      tags:
      - chat
  /api/v1/context-fills/{fill_id}/dismiss:
    post:
      description: Hide a fill card for good. Requester only; repeating it is 200 and writes nothing.
      operationId: dismiss_context_fill
      parameters:
      - in: path
        name: fill_id
        required: true
        schema:
          format: uuid
          title: Fill Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextFillDismissed'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
