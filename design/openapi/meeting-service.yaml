info:
  title: meeting-service
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/meetings/{meeting_id}/consent-receipt:
    get:
      description: 'Your own consent receipt for this meeting (polish wave 3, Off the record): whether
        you

        agreed, when, to which version of the notice, and what that version said, clause by clause.

        Read from the room ("What is recorded") and from the meeting page. Only ever the caller''s

        own participant row: there is no way to name another person. Same existence-then-

        participation order and codes as the token mint.'
      operationId: get_consent_receipt
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentReceipt'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/Problem'
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Get Consent Receipt
      tags:
      - meetings
  /api/meetings/{meeting_id}/recording:
    get:
      description: 'Participants only, deny-by-default: the recording''s status and, when ready, a

        short-lived presigned URL per segment (never a public URL). Each answer with URLs is

        audited (`recording.playback_issued`). Off-the-record stretches are not in the recording:

        they are the gaps between segments.'
      operationId: get_recording
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingState'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '403':
          content:
            application/problem+json:
              schema: *id001
          description: Not a participant of this meeting.
        '404':
          content:
            application/problem+json:
              schema: *id001
          description: No such meeting in this workspace.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: A meeting's recording, for playback
      tags:
      - recordings
  /api/meetings/{meeting_id}/session:
    get:
      description: 'The caller''s standing in this meeting''s call: whether consent is required and already

        given (so the pre-join asks once per person per meeting), whether audio/video is recorded

        (so the notice says exactly what is kept), and when the call started (the meeting clock).

        Same existence-then-participation order and codes as the token mint.'
      operationId: get_room_session
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomSession'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Get Room Session
      tags:
      - meetings
  /api/meetings/{meeting_id}/token:
    post:
      operationId: mint_token
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/TokenRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: No bearer token, or a token that is expired, malformed or fails JWKS verification.
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      summary: Mint Token
      tags:
      - meetings
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Healthz Healthz Get
                type: object
          description: Successful Response
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security: []
      summary: Healthz
  /internal/meetings/{meeting_id}/clips/{clip_id}/video:
    post:
      description: 'The video of one shared clip (core-api checked the share and the clip). Only the clip''s

        own object is ever presigned; it is cut on first request (`rendering`) and served after.'
      operationId: clip_video
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      - in: path
        name: clip_id
        required: true
        schema:
          format: uuid
          title: Clip Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipVideoRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipVideo'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: Missing or invalid credentials for this operation's own security scheme (not a
            bearer token).
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security:
      - MytheusServiceToken: []
      summary: Clip Video
      tags:
      - meeting-internal
  /internal/meetings/{meeting_id}/recording/erase:
    post:
      description: 'A meeting''s data erasure (core-api `POST /api/v1/erasures`): delete every object
        under

        the meeting''s `{org_id}/{meeting_id}/` prefix (segments and rendered clips) and its

        recording rows. Works on a meeting core-api has already soft-deleted. Idempotent.'
      operationId: erase_recording
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingErased'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: Missing or invalid credentials for this operation's own security scheme (not a
            bearer token).
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
        '500':
          content:
            application/problem+json:
              schema: *id001
          description: Unhandled server error. Carries a `trace_id` and no internals.
      security:
      - MytheusServiceToken: []
      summary: Erase Recording
      tags:
      - meeting-internal
  /internal/meetings/{meeting_id}/recording/pause:
    post:
      description: 'Off the record began: stop the running egress so nothing from the stretch is kept.

        Idempotent (nothing running is `changed: false`).'
      operationId: pause_recording
      parameters:
      - in: path
        name: meeting_id
        required: true
        schema:
          format: uuid
          title: Meeting Id
          type: string
      - description: Client-generated key making this write safe to retry. A replay with the same key
          replays the original response; a replay with a different body is `409 IDEMPOTENCY_KEY_REUSED`.
          Scoped per tenant and per route.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingControlResult'
          description: Successful Response
        '401':
          content:
            application/problem+json:
              schema: *id001
          description: Missing or invalid credentials for this operation's own security scheme (not a
            bearer token).
        '422':
          content:
            application/problem+json:
              schema: *id001
          description: Validation Error
