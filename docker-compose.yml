services:

  postgres:
    image: supabase/postgres:15.8.1.060
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mytheus
    # Published on 5433, not 5432, so this stack never collides with another local
    # Postgres. tests/conftest.py targets this port; .env.example matches it.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # supabase/postgres ships `postgres` pre-created, so it never applies
      # POSTGRES_PASSWORD to that role and TCP auth fails. This is the image's own
      # post-bootstrap hook for exactly this. Never mount over docker-entrypoint-initdb.d:
      # that shadows the image's bootstrap and the container dies. See the file's header.
      - ./docker/postgres-dev-password.sql:/etc/postgresql.schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Published on 6380 for the same reason as Postgres above.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr http://0.0.0.0:8081
      - --pandaproxy-addr http://0.0.0.0:8082
    ports:
      - "9092:9092"
      - "8081:8081"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      # auto-setup's driver name, not the engine name: it accepts only
      # mysql8 / postgres12 / postgres12_pgx / cassandra and exits 1 on anything else.
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      # development-sql.yaml is bind-mounted by temporal's own compose repo and does not
      # exist inside this image; docker.yaml is the only file it actually ships.
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    # Pinned to a patch tag: temporalio/ui publishes 2.26.x, never a bare `2.26`,
    # so `docker compose up` fails to resolve the minor-only reference.
    image: temporalio/ui:2.26.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    # 8088, not 8080: `make run-gateway` binds 8080 on the host.
    ports:
      - "8088:8080"
    depends_on:
      - temporal

volumes:
  postgres_data:
