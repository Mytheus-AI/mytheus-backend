name: ci

# mytheus-backend's copy of the canonical template in mytheus-platform/.github/workflows/ci.yml,
# with the database wired up. Plan 1-2 section 3.11.
#
# The whole point of this file is the `test` job below. Two CI assertions in
# tests/test_roles_and_policies.py are the compensating controls that make defect D1
# unrepeatable and make removing the `organizations` policy safe. Until this workflow existed
# they ran only when somebody remembered to type `make ci`, which is not a control.

on:
  pull_request: {}
  push:
    branches: [main]

env:
  # Ports match docker-compose.yml and tests/conftest.py: 5433/6380, so a developer and CI
  # run the identical configuration. Disagreement here is what defect D7 was.
  #
  # Both URLs are set, and set to DIFFERENT roles on purpose. The suite seeds cross-tenant
  # fixtures as the owner and asserts isolation as `mytheus_app`; pointing both at the owner
  # would make every isolation test pass while proving nothing, because the owner is not
  # subject to the policies. That is the shape defect D1 took, so CI must run the same split a
  # developer does.
  BOOTSTRAP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/mytheus
  DATABASE_URL: postgresql+asyncpg://mytheus_app:mytheus_app@localhost:5433/mytheus
  REDIS_URL: redis://localhost:6380
  REDPANDA_BROKERS: localhost:9092
  SCHEMA_REGISTRY_URL: http://localhost:8081

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mytheus
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      # The gRPC stubs are gitignored ("regenerate in CI"), so without this pytest fails at
      # COLLECTION on a clean checkout and the gate never reaches a real test.
      - run: make proto
      - name: pytest (database tests MUST run, not skip)
        # MYTHEUS_REQUIRE_DB=1 turns "Postgres unreachable" from a skip into a hard failure.
        # Without it a broken service container produces a green build that has proved
        # nothing, which is precisely how defect D7 survived.
        env:
          MYTHEUS_REQUIRE_DB: "1"
        run: uv run pytest -q
      - name: assert the isolation tests actually executed
        # Belt and braces on the guard above. If someone marks these xfail, renames the file,
        # or the collection silently changes, this fails loudly. These six are the ones that
        # prove tenant isolation for the role the application really connects as.
        #
        # The last two arrived with migration 9b2c4d1e6f30. The four above them all passed
        # while `service_role` - which `supabase/postgres` ships holding `rolbypassrls`, and
        # grants the full DML set on every new table in `public` - could read and delete every
        # tenant's `audit_logs` rows with no `app.current_org` set. They were each scoped to
        # the three roles this program creates, so none of them could see it.
        env:
          MYTHEUS_REQUIRE_DB: "1"
        run: |
          uv run pytest -q --no-header \
            tests/test_roles_and_policies.py::test_no_application_role_is_superuser_or_bypasses_rls \
            tests/test_roles_and_policies.py::test_every_org_id_table_has_a_tenant_isolation_policy \
            tests/test_roles_and_policies.py::test_no_application_role_can_reach_a_partition_directly \
            tests/test_rls.py::test_outbox_fails_closed_with_no_guc \
            tests/test_roles_and_policies.py::test_public_schema_grants_nothing_by_default \
            tests/test_roles_and_policies.py::test_no_bypassrls_role_holds_privileges_on_a_public_table \
            | tee /tmp/isolation.txt
          grep -qE "6 passed" /tmp/isolation.txt || {
            echo "::error::the tenant-isolation assertions did not all run and pass"; exit 1; }

  migrations:
    # Reversibility, proven on every PR rather than asserted in a document. Also catches a
    # migration that only applies to an already-populated developer database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mytheus
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - name: upgrade, downgrade one, upgrade again
        run: |
          uv run alembic -c migrations/alembic.ini upgrade head
          uv run alembic -c migrations/alembic.ini downgrade -1
          uv run alembic -c migrations/alembic.ini upgrade head
      - name: bootstrap_roles refuses a role that bypasses RLS
        env:
          MYTHEUS_APP_PASSWORD: ci_app
          MYTHEUS_RELAY_PASSWORD: ci_relay
          MYTHEUS_ADMIN_PASSWORD: ci_admin
        run: |
          uv run python -m scripts.bootstrap_roles
          # Grant BYPASSRLS deliberately and assert the script catches it. A guard nobody has
          # seen fail is a guard nobody knows works.
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d mytheus \
            -c "ALTER ROLE mytheus_app BYPASSRLS;"
          if uv run python -m scripts.bootstrap_roles; then
            echo "::error::bootstrap_roles accepted a role holding BYPASSRLS"; exit 1
          fi
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d mytheus \
            -c "ALTER ROLE mytheus_app NOBYPASSRLS;"

  authz-check:
    # Every FastAPI route must declare an auth dependency or be explicitly public
    # (11-security-architecture.md section 3.2). A route with neither fails the PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run python scripts/check_authz.py

  openapi:
    # Spec governance, in three gates that catch three different things.
    #
    # Until now this repo had none of them: the five specs in mytheus-docs/design/openapi were
    # hand-written in P1 before any route existed, `spectral lint` had never been executed, and
    # `oasdiff` was never wired. The Plan 1-2 DoD line for this has been PARTIAL since.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # oasdiff needs the merge base to compare against. A shallow clone has no main.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv sync

      - name: the committed specs match the code
        # The drift gate, and the reason a generated client is now safe to build. Changing a
        # route without running `make openapi` fails here rather than shipping a spec that
        # quietly stopped being true.
        run: uv run python -m scripts.emit_openapi --check

      - name: spectral lint
        # --fail-severity=error so the built-in spectral:oas style warnings (missing
        # descriptions, tags, servers) are reported without blocking. The 13 house rules that
        # encode real invariants - org_id never in a path or query, document-level security,
        # RFC 7807 on every error, cursor pagination - are all `severity: error`.
        run: |
          npx --yes @stoplight/spectral-cli@6 lint "design/openapi/*.yaml"             --ruleset design/.spectral.yaml --fail-severity=error

      - name: oasdiff breaking-change gate
        # Compares this branch's specs against the base branch's. Catches a removed path, a
        # newly-required request field, a narrowed request enum - changes that compile fine and
        # break every existing client.
        #
        # Skipped on a push to main, where there is no base to diff against: the comparison is
        # "what this change does to the contract", which only exists for a change.
        #
        # `--fail-on ERR` is load-bearing, not a refinement. Without it `oasdiff breaking`
        # PRINTS the breaking changes and still exits 0, so the `|| failed=1` below never
        # fires and the gate passes a build it has just finished describing as broken.
        # Proven both ways against `tufin/oasdiff:latest`: deleting a path reports
        # `api-path-removed-without-deprecation` and exits 0 without the flag, 1 with it.
        # This step has never run in Actions (it is pull_request-only and no PR has carried a
        # spec change), which is why the exit code had never been observed.
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          mkdir -p /tmp/oasdiff-base
          failed=0
          for spec in design/openapi/*.yaml; do
            name="$(basename "$spec")"
            if ! git show "$base:$spec" > "/tmp/oasdiff-base/$name" 2>/dev/null; then
              echo "::notice::$name is new on this branch; nothing to compare against"
              continue
            fi
            echo "--- $name ---"
            docker run --rm               -v /tmp/oasdiff-base:/base:ro               -v "$PWD/design/openapi:/head:ro"               tufin/oasdiff:latest breaking --fail-on ERR "/base/$name" "/head/$name" || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::a breaking API change was detected. Bump to /api/v2 with a"
            echo "::error::deprecation window, or make the change additive."
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks BINARY is open source and free to run. Only the gitleaks-action wrapper
      # this replaces requires a paid licence for organisation-owned repos. When the repo
      # moved from a personal account into the Mytheus-AI org, that wrapper began hard-failing
      # with "License key is required", so the secret-scanning gate — the control that is
      # supposed to keep a leaked credential out of history — has been dead ever since, and
      # main has been red on it. Running the binary restores the gate with no licence to buy
      # and no extra secret to hold.
      #
      # `git` (not the old `detect`, renamed in v8.19) scans full history, which is why the
      # checkout above uses fetch-depth: 0. Non-zero exit on a finding is the gate.
      - name: gitleaks (secret scan)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      # Not `|| true`. A known-vulnerable dependency should fail the PR, which is the entire
      # point of running the scan; pip-audit exits 1 on any finding.
      #
      # --skip-editable skips this repo itself, which is installed editable and has no PyPI
      # entry to audit. Not combined with --strict: --strict also fails on skips, so the two
      # together fail on the local package every single run and the gate gets disabled.
      - run: uv run pip-audit --skip-editable

  docker:
    # Build the deployable image so a broken Dockerfile fails the PR, not the deploy.
    #
    # On main the same build is PUSHED to GHCR, and that published image is what the VPS
    # deploys. Before this, compose.prod.yml built the backend from a sibling checkout
    # (`context: ../../mytheus-backend`), so the running image existed only on the box that
    # built it: unreproducible, and impossible for any deploy tool to pull.
    #
    # No PAT is involved. The built-in GITHUB_TOKEN pushes to GHCR given `packages: write`
    # below, so publishing needs no human-held credential and nothing to rotate.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          # PRs build but never push. A PR can come from a fork, and pushing an unreviewed
          # image to the `main` tag the VPS pulls would be a supply-chain hole.
          push: ${{ github.event_name == 'push' }}
          # Two tags on purpose: the SHA tag is the immutable artifact to pin or roll back
          # to, `main` is the moving pointer a deploy follows.
          tags: |
            ghcr.io/mytheus-ai/mytheus-backend:${{ github.sha }}
            ghcr.io/mytheus-ai/mytheus-backend:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Continuous deployment to the VPS. Runs only after the image is published AND every gate
    # is green - listing all of them in `needs` is the point: `docker` alone would happily ship
    # an image whose tenant-isolation assertions had just failed, which is the one thing this
    # pipeline exists to prevent.
    needs: [lint, test, migrations, authz-check, openapi, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Shares a concurrency group name with mytheus-platform's deploy workflow only by
    # convention; GitHub scopes concurrency per repository, so the real serialisation is that
    # the deploy script itself is a single `docker compose up` against one project.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: configure ssh
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key rather than accept-new, which would trust whatever answers first.
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: deploy
        # No command argument: the key's forced command in authorized_keys decides what runs
        # (/usr/local/sbin/mytheus-deploy.sh). This credential cannot open a shell, run another
        # script, or forward a port, so a leak buys a redeploy of current main and nothing else.
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=30 \
              root@${{ secrets.VPS_HOST }}

      - name: verify the deployed API serves traffic
        # The server-side script already waits on the container healthcheck; this exercises the
        # public path (Cloudflare -> the Caddy holding 443 -> the docker network) so a green
        # deploy cannot mean "container up, nobody can reach it".
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/body -m 20 -w '%{http_code}' https://api.mytheus.cloud/healthz || echo 000)
            if [ "$code" = "200" ]; then echo "healthz OK: $(cat /tmp/body)"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 10
          done
          echo "::error::api.mytheus.cloud/healthz did not return 200 after the deploy"
          exit 1
