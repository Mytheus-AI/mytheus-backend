# pre-commit hooks for mytheus-backend. Install once: `uv run pre-commit install`.
# Local hooks use the project's pinned tools (same as CI) so hook == gate.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
      - id: black
        name: black
        entry: uv run black --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
      - id: authz-check
        name: authz-check (every FastAPI route declares auth or is public)
        entry: uv run python scripts/check_authz.py
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
