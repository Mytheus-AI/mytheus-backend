# api-gateway — single public ingress for reprise-backend
# Supabase JWT pre-validation using nginx-lua (openresty) or envoy ext_authz.
# The service tier re-verifies the JWT; this is a DDoS shield, not a trust delegation.
#
# For local dev: requests go straight to services without this gateway.
# For production: use the Envoy/Nginx config in reprise-platform (Terraform/K8s).

upstream bff {
    server bff:8000;
}

upstream identity_tenant_service {
    server identity-tenant-service:8001;
}

upstream core_api {
    server core-api:8002;
}

upstream meeting_service {
    server meeting-service:8003;
}

upstream integration_service {
    server integration-service:8004;
}

upstream billing_metering_service {
    server billing-metering-service:8005;
}

upstream admin_ops_service {
    server admin-ops-service:8006;
}

upstream notification_service {
    server notification-service:8007;
}

server {
    listen 80;
    server_name _;

    # --- JWT pre-validation ---
    # TODO: add lua-resty-jwt or envoy ext_authz filter here.
    # Supabase JWKS: https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
    # Extract org_id from the validated JWT's custom claim.
    # FAIL CLOSED: reject with 401 if JWT missing, expired, or org_id unresolvable.

    # Global rate limit
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
    limit_req zone=global burst=200 nodelay;

    location /bff/ {
        proxy_pass http://bff;
        proxy_set_header X-Org-Id $org_id;  # extracted from JWT
        proxy_set_header X-User-Id $user_id;
    }

    location /orgs {
        proxy_pass http://identity_tenant_service;
    }

    location /rbac/ {
        proxy_pass http://identity_tenant_service;
    }

    location /scim/ {
        proxy_pass http://identity_tenant_service;
    }

    location /context/ {
        proxy_pass http://identity_tenant_service;
    }

    location /supabase/ {
        proxy_pass http://identity_tenant_service;
    }

    location /meetings {
        proxy_pass http://core_api;
    }

    location /decisions {
        proxy_pass http://core_api;
    }

    location /actions {
        proxy_pass http://core_api;
    }

    location /worklogs {
        proxy_pass http://core_api;
    }

    location /chat {
        proxy_pass http://core_api;
    }

    location /teams {
        proxy_pass http://core_api;
    }

    location /departments {
        proxy_pass http://core_api;
    }

    location /suggestions {
        proxy_pass http://core_api;
    }

    location /api/meetings/ {
        proxy_pass http://meeting_service;
    }

    location /livekit/ {
        proxy_pass http://meeting_service;
    }

    location /oauth/ {
        proxy_pass http://integration_service;
    }

    location /webhooks/ {
        proxy_pass http://integration_service;
    }

    location /billing/ {
        proxy_pass http://billing_metering_service;
    }

    location /usage {
        proxy_pass http://billing_metering_service;
    }

    location /stripe/ {
        proxy_pass http://billing_metering_service;
    }

    location /admin/ {
        proxy_pass http://admin_ops_service;
    }

    location /notifications {
        proxy_pass http://notification_service;
    }
}
